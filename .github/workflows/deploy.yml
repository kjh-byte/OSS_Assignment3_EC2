name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~
            if [ -d "OSS_Assignment3_EC2" ]; then
              cd OSS_Assignment3_EC2 && git pull
            else
              git clone https://github.com/${{ github.repository }}.git
              cd OSS_Assignment3_EC2
            fi
            
            pip3 install --break-system-packages -r requirements.txt
            
            sudo pkill -f streamlit || true
            nohup python3 -m streamlit run app.py --server.port 8501 --server.address 0.0.0.0 > streamlit.log 2>&1 &
